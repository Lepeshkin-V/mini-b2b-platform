name: mini-b2b-platform

services:
  api:
    build: .
    ports:
      - "${PORT}:3000"
    depends_on:
      - redis
      - postgres
    env_file: 
      - .env
  postgres:
    image: postgres:16-alpine3.23
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
volumes:
  pgdata:
  redis-data: