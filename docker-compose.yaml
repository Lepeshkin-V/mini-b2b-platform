name: mini-b2b-platform

services:
  api:
    build: .
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      redis:
        condition:
          service_started
      postgres:
        condition:
          service_healthy
    env_file: 
      - .env
  postgres:
    image: postgres:16-alpine3.23
    ports:
      - "${POSTGRES_PORT_OUTSIDE}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
volumes:
  pgdata:
  redis-data: